<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人中心 - CC98论坛</title>
  <link id="mainStylesheet" rel="stylesheet" href="/tests/fixtures/native-forum.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="root">
    <header class="topBar"><div class="topBarRight"><span class="topBarUserName">测试用户</span></div></header>
    <div class="user-center">
      <div class="user-center-content">
        <div class="user-center-head"><p>个人中心</p></div>
        <div class="user-center-body">
          <div class="user-center-navigation" id="userCenterNavigation">
            <ul>
              <li><a href="/usercenter" class="fa-home user-center-navigation-active"><div class="center-nav-item">个人主页</div></a></li><hr>
              <li><a href="/usercenter/config" class="fa-cog"><div class="center-nav-item">修改资料</div></a></li><hr>
              <li><a href="/usercenter/mytopics" class="fa-pencil-square-o"><div class="center-nav-item">我的主题</div></a></li><hr>
              <li><a href="/usercenter/myposts" class="fa-mail-reply"><div class="center-nav-item">我的回复</div></a></li><hr>
              <li><a href="/usercenter/myhistory" class="fa-history"><div class="center-nav-item">我的足迹</div></a></li><hr>
              <li><a href="/usercenter/myfavorites" class="fa-star"><div class="center-nav-item">我的收藏</div></a></li><hr>
              <li><a href="/usercenter/mycustomboards" class="fa-rss"><div class="center-nav-item">关注版面</div></a></li><hr>
              <li><a href="/usercenter/myfollowings" class="fa-heart"><div class="center-nav-item">关注用户</div></a></li><hr>
              <li><a href="/usercenter/myfans" class="fa-users"><div class="center-nav-item">我的粉丝</div></a></li><hr>
              <li><a href="/usercenter/transferwealth" class="fa-credit-card"><div class="center-nav-item">转账系统</div></a></li><hr>
              <li><a href="/usercenter/theme" class="fa-magic"><div class="center-nav-item">切换皮肤</div></a></li>
            </ul>
            <button type="button" id="scrollToTop"><div class="top-button-text">回到顶部</div></button>
          </div>
          <div class="user-center-router" id="fixture-native-router"><section class="user-center-exact"><h2>个人主页</h2><p>原生个人中心内容。</p><textarea id="native-profile-draft">个人主页草稿</textarea></section></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.__userSettingsFixture = { nativeNavigations: [], draft: document.getElementById("native-profile-draft") };
    function syncNativeRoute() {
      const path = location.pathname.toLowerCase();
      const links = [...document.querySelectorAll("#userCenterNavigation a[href^='/usercenter']")];
      const active = links.find((link) => link.getAttribute("href").toLowerCase() === path) || links[0];
      links.forEach((node) => node.classList.toggle("user-center-navigation-active", node === active));
      document.querySelector("#fixture-native-router h2").textContent = active.textContent.trim();
    }
    document.getElementById("userCenterNavigation").addEventListener("click", (event) => {
      const link = event.target.closest("a[href^='/usercenter']");
      if (!link) return;
      event.preventDefault();
      const href = link.getAttribute("href");
      __userSettingsFixture.nativeNavigations.push(href);
      history.pushState({}, "", href);
      syncNativeRoute();
    });
    window.addEventListener("popstate", syncNativeRoute);
    syncNativeRoute();
  </script>
</body>
</html>
