<!doctype html>
<html lang="zh-CN" class="cc98-comfort">
<head>
  <meta charset="utf-8">
  <title>CC98 Reborn interaction regression</title>
  <link rel="stylesheet" href="../src/styles.css">
  <style>
    body { padding: 24px; }
    .search-history-regression {
      position: relative;
      width: min(420px, calc(100vw - 48px));
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <main id="results"></main>
  <script>
    window.chrome = {
      storage: {
        local: {
          get(_key, callback) {
            callback({});
          },
          set(_value, callback) {
            callback?.();
          },
          remove(_key, callback) {
            callback?.();
          }
        },
        onChanged: {
          addListener() {}
        }
      },
      runtime: {
        lastError: null,
        getURL(path) {
          return path;
        },
        sendMessage(_message, callback) {
          callback?.({ ok: false });
        },
        onMessage: {
          addListener() {}
        }
      }
    };
  </script>
  <script src="../src/content.js"></script>
  <script>
    const results = document.querySelector("#results");
    const checks = [];
    const waitForRegression = (delay) => new Promise((resolve) => setTimeout(resolve, delay));

    function check(name, condition, detail = "") {
      checks.push({ name, passed: Boolean(condition), detail });
    }

    async function run() {
      if (new URLSearchParams(location.search).has("side")) {
        document.documentElement.dataset.cc98ComfortSideTopbar = "true";
      }
      document.body.insertAdjacentHTML("beforeend", `
        <section class="topicInfo-info">
          <div id="essay1">Regression topic</div>
          <div class="topicInfo-boardMessage"><a>Test board</a></div>
        </section>
      `);

      const favorite = document.createElement("div");
      favorite.className = "followTopic";
      favorite.textContent = "\u6536\u85cf";
      let favoriteClicks = 0;
      favorite.addEventListener("click", () => {
        favoriteClicks += 1;
      });
      const favoriteProxy = renderProxyControl({
        text: "\u6536\u85cf",
        href: "",
        control: favorite,
        scope: "topic"
      });
      document.body.append(favorite, favoriteProxy);
      favoriteProxy.click();
      check("favorite dispatches once", favoriteClicks === 1, `clicks=${favoriteClicks}`);

      const score = document.createElement("div");
      score.className = "operation1";
      score.textContent = "\u8bc4\u5206";
      let scoreClicks = 0;
      score.addEventListener("click", () => {
        scoreClicks += 1;
      });
      const scoreProxy = renderProxyControl({
        text: "\u8bc4\u5206",
        href: "",
        control: score,
        scope: "post"
      });
      document.body.append(score, scoreProxy);
      scoreProxy.click();
      check("score dispatches once", scoreClicks === 1, `clicks=${scoreClicks}`);
      for (let index = 0; index < 3; index += 1) {
        await waitForRegression(340);
        scoreProxy.click();
      }
      check("repeated score clicks do not accumulate handlers", scoreClicks === 4, `clicks=${scoreClicks}`);

      const oldPost = document.createElement("div");
      oldPost.className = "reply";
      oldPost.id = "reply839454548";
      oldPost.dataset.floor = "6";
      const oldScore = document.createElement("div");
      oldScore.className = "operation1";
      oldScore.textContent = "\u8bc4\u5206";
      oldPost.append(oldScore);
      document.body.append(oldPost);
      const staleScoreAction = collectPostActions(oldPost)
        .find((action) => getProxyActionIdentity(action) === "score");
      const staleScoreProxy = renderProxyControl(staleScoreAction);
      document.body.append(staleScoreProxy);
      oldPost.remove();
      const newPost = document.createElement("div");
      newPost.className = "reply";
      newPost.id = "reply839454548";
      newPost.dataset.floor = "6";
      const newScore = document.createElement("div");
      newScore.className = "operation1";
      newScore.textContent = "\u8bc4\u5206";
      let newScoreClicks = 0;
      newScore.addEventListener("click", () => {
        newScoreClicks += 1;
      });
      newPost.append(newScore);
      document.body.append(newPost);
      staleScoreProxy.click();
      check("stale score control is re-resolved", newScoreClicks === 1, `clicks=${newScoreClicks}`);

      const topicToolbar = document.querySelector(".topicInfo-info");
      const oldFavorite = document.createElement("div");
      oldFavorite.className = "followTopic";
      oldFavorite.textContent = "\u6536\u85cf";
      topicToolbar.append(oldFavorite);
      const staleFavoriteProxy = renderProxyControl({
        text: "\u6536\u85cf",
        href: "",
        control: oldFavorite,
        scope: "topic"
      });
      document.body.append(staleFavoriteProxy);
      oldFavorite.remove();
      const newFavorite = document.createElement("div");
      newFavorite.className = "followTopic";
      newFavorite.textContent = "\u6536\u85cf";
      let newFavoriteClicks = 0;
      newFavorite.addEventListener("click", () => {
        newFavoriteClicks += 1;
      });
      topicToolbar.append(newFavorite);
      staleFavoriteProxy.click();
      check("stale favorite control is re-resolved", newFavoriteClicks === 1, `clicks=${newFavoriteClicks}`);

      const like = document.createElement("div");
      like.className = "upup";
      like.innerHTML = '<i class="fa fa-thumbs-o-up"></i><span class="commentProp"> 3</span>';
      const dislike = document.createElement("div");
      dislike.className = "downdown red-color";
      dislike.innerHTML = '<i class="fa fa-thumbs-down"></i><span class="commentProp"> 2</span>';
      let likeClicks = 0;
      let dislikeClicks = 0;
      like.addEventListener("click", () => {
        likeClicks += 1;
      });
      dislike.addEventListener("click", () => {
        dislikeClicks += 1;
      });
      const voteGroup = {};
      const likeAction = { text: "\u8d5e 3", href: "", control: like, scope: "post", kind: "like", voteGroup };
      const dislikeAction = { text: "\u8e29 2", href: "", control: dislike, scope: "post", kind: "dislike", voteGroup };
      voteGroup.like = likeAction;
      voteGroup.dislike = dislikeAction;
      const likeProxy = renderProxyControl(likeAction);
      const dislikeProxy = renderProxyControl(dislikeAction);
      document.body.append(like, dislike, likeProxy, dislikeProxy);
      likeProxy.click();
      check("vote uses one native request", likeClicks === 1 && dislikeClicks === 0, `like=${likeClicks}, dislike=${dislikeClicks}`);
      check("vote proxy is mutually exclusive", likeProxy.classList.contains("is-active") && !dislikeProxy.classList.contains("is-active"));

      let copiedText = "";
      try {
        Object.defineProperty(navigator, "clipboard", {
          configurable: true,
          value: {
            async writeText(text) {
              copiedText = text;
            }
          }
        });
      } catch {
        document.execCommand = () => {
          copiedText = document.activeElement?.value || "";
          return true;
        };
      }
      const share = document.createElement("div");
      share.className = "followTopic";
      share.textContent = "\u5206\u4eab\u5e16\u5b50\u94fe\u63a5";
      let shareNativeClicks = 0;
      share.addEventListener("click", () => {
        shareNativeClicks += 1;
      });
      const shareProxy = renderProxyControl({
        text: "\u5206\u4eab\u5e16\u5b50\u94fe\u63a5",
        href: "",
        control: share,
        scope: "topic"
      });
      document.body.append(share, shareProxy);
      shareProxy.click();
      await waitForRegression(20);
      check("share bypasses the fragile native proxy", shareNativeClicks === 0, `clicks=${shareNativeClicks}`);
      check("share writes meaningful text", /Regression topic/.test(copiedText), copiedText);

      const editor = document.createElement("div");
      editor.className = "createTopic";
      const textarea = document.createElement("textarea");
      textarea.value = "test";
      const submit = document.createElement("button");
      submit.id = "post-topic-button";
      submit.className = "button blue";
      submit.textContent = "\u53d1\u8868";
      let submitClicks = 0;
      submit.addEventListener("click", () => {
        submitClicks += 1;
      });
      editor.append(textarea, submit);
      document.body.append(editor);
      bindNativeEditorStabilizer(editor);
      submit.click();
      submit.click();
      const submitContext = readEditorSubmitContext();
      check("submit reaches the native handler once", submitClicks === 1, `clicks=${submitClicks}`);
      check("submit recovery context is recorded", submitContext?.submitKind === "post", JSON.stringify(submitContext));
      clearEditorSubmitIntent();
      editor.remove();

      const replyEditor = document.createElement("div");
      replyEditor.id = "sendTopicInfo";
      const replyTextarea = document.createElement("textarea");
      replyTextarea.value = "reply test";
      const replySubmit = document.createElement("button");
      replySubmit.id = "post-topic-button";
      replySubmit.className = "button blue";
      replySubmit.textContent = "\u56de\u590d";
      let replyClicks = 0;
      replySubmit.addEventListener("click", () => {
        replyClicks += 1;
      });
      replyEditor.append(replyTextarea, replySubmit);
      document.body.append(replyEditor);
      bindNativeEditorStabilizer(replyEditor);
      replySubmit.click();
      replySubmit.click();
      const replyContext = readEditorSubmitContext();
      check("reply reaches the native handler once", replyClicks === 1, `clicks=${replyClicks}`);
      check("reply recovery context is recorded", replyContext?.submitKind === "reply", JSON.stringify(replyContext));
      clearEditorSubmitIntent();

      writeSearchHistory([]);
      rememberSearchHistoryQuery("\u8bfe\u7a0b\u8bc4\u4ef7");
      rememberSearchHistoryQuery("\u9009\u8bfe\u8d44\u6599");
      rememberSearchHistoryQuery("\u8bfe\u7a0b\u8bc4\u4ef7");
      const searchHistoryBox = document.createElement("div");
      searchHistoryBox.className = "cc98-rebuild-search-suggestions";
      const searchHistoryInput = document.createElement("input");
      const searchHistoryHarness = document.createElement("form");
      searchHistoryHarness.className = "cc98-rebuild-search search-history-regression";
      let submittedHistoryQuery = "";
      renderSearchSuggestions(
        searchHistoryBox,
        searchHistoryInput,
        ["\u8bfe\u7a0b\u8bc4\u4ef7 \u8001\u5e08"],
        "ready",
        (value) => {
          submittedHistoryQuery = value;
        }
      );
      searchHistoryHarness.append(searchHistoryInput, searchHistoryBox);
      document.body.append(searchHistoryHarness);
      const historySection = searchHistoryBox.querySelector(".cc98-rebuild-search-history");
      const suggestionHeading = searchHistoryBox.querySelector(".cc98-rebuild-search-suggestion-heading");
      check(
        "search history renders above suggestions",
        historySection && suggestionHeading && historySection.compareDocumentPosition(suggestionHeading) & Node.DOCUMENT_POSITION_FOLLOWING
      );
      check(
        "search history de-duplicates repeated queries",
        searchHistoryBox.querySelectorAll(".cc98-rebuild-search-history-item").length === 2
      );
      searchHistoryBox.querySelector(".cc98-rebuild-search-history-query")?.click();
      check("search history item submits its query", submittedHistoryQuery === "\u8bfe\u7a0b\u8bc4\u4ef7", submittedHistoryQuery);
      searchHistoryBox.querySelector(".cc98-rebuild-search-history-delete")?.click();
      check(
        "search history supports deleting one item",
        searchHistoryBox.querySelectorAll(".cc98-rebuild-search-history-item").length === 1
      );
      searchHistoryBox.querySelector(".cc98-rebuild-search-history-clear")?.click();
      check(
        "search history supports clearing all items",
        searchHistoryBox.querySelectorAll(".cc98-rebuild-search-history-item").length === 0
      );
      rememberSearchHistoryQuery("\u8bfe\u7a0b\u8bc4\u4ef7");
      rememberSearchHistoryQuery("\u9009\u8bfe\u8d44\u6599");
      renderSearchSuggestions(
        searchHistoryBox,
        searchHistoryInput,
        ["\u8bfe\u7a0b\u8bc4\u4ef7 \u8001\u5e08"],
        "ready",
        (value) => {
          submittedHistoryQuery = value;
        }
      );

      const colorEditor = document.createElement("div");
      colorEditor.className = "cc98-rebuild-native-editor";
      const colorTextarea = document.createElement("textarea");
      colorTextarea.value = "test";
      colorTextarea.setSelectionRange(0, 4);
      const colorButton = document.createElement("button");
      colorButton.type = "button";
      colorButton.className = "ubb-button-color cc98-rebuild-color-button";
      colorEditor.append(colorTextarea, colorButton);
      document.body.append(colorEditor);
      const colorPanel = ensureEditorColorPopover(colorEditor, colorButton);
      colorPanel.hidden = false;
      const colorHexInput = colorPanel.querySelector(".cc98-rebuild-color-popover-input");
      colorHexInput.focus();
      colorHexInput.value = "#";
      colorHexInput.dispatchEvent(new Event("input", { bubbles: true }));
      check("partial color input remains editable", colorHexInput.value === "#", colorHexInput.value);
      colorHexInput.value = "#114E66";
      colorHexInput.dispatchEvent(new Event("input", { bubbles: true }));
      check(
        "complete color input updates the picker without replacing typed text",
        colorHexInput.value === "#114E66" && colorPanel.dataset.cc98CurrentColor === "#114e66",
        `${colorHexInput.value}/${colorPanel.dataset.cc98CurrentColor}`
      );
      const colorHexInputWidth = Number.parseFloat(getComputedStyle(colorHexInput).width);
      check(
        "color hex input keeps its compact width",
        Number.isFinite(colorHexInputWidth) && colorHexInputWidth <= 116,
        String(colorHexInputWidth)
      );
      colorTextarea.focus();
      colorTextarea.setSelectionRange(0, 4);
      rememberEditorSelection(colorEditor, colorButton);
      colorPanel.querySelector(".cc98-rebuild-color-transparent")?.click();
      colorPanel.querySelector(".cc98-rebuild-color-popover-ok")?.click();
      check(
        "transparent color inserts valid UBB",
        colorTextarea.value === "[color=transparent]test[/color]",
        colorTextarea.value
      );

      const crossLinePreview = buildNativeEditorUbbPreview("[b]first line\nsecond line[/b]");
      check(
        "cross-line UBB keeps one formatting scope",
        crossLinePreview.querySelector("strong")?.textContent === "first line\nsecond line",
        crossLinePreview.textContent
      );

      const dualNativeEditor = document.createElement("div");
      dualNativeEditor.className = "createTopic";
      const dualNativeShell = document.createElement("div");
      dualNativeShell.className = "ubb-editor";
      const dualNativeToolbar = document.createElement("div");
      dualNativeToolbar.className = "ubb-buttons";
      const dualNativeBold = document.createElement("button");
      dualNativeBold.type = "button";
      dualNativeBold.className = "fa fa-bold ubb-button";
      dualNativeBold.title = "加粗";
      const dualNativeTextarea = document.createElement("textarea");
      dualNativeTextarea.value = "双向编辑";
      dualNativeToolbar.append(dualNativeBold);
      dualNativeShell.append(dualNativeToolbar, dualNativeTextarea);
      dualNativeEditor.append(dualNativeShell);
      document.body.append(dualNativeEditor);
      bindNativeEditorStabilizer(dualNativeEditor);
      await waitForRegression(100);
      const dualWorkspace = dualNativeEditor.querySelector(".cc98-rebuild-native-dual-ubb-workspace");
      const dualVisualPane = dualWorkspace?.querySelector(".cc98-rebuild-dual-ubb-visual-pane");
      const dualVisual = dualWorkspace?.querySelector(".cc98-rebuild-dual-ubb-visual");
      const dualDivider = dualWorkspace?.querySelector(".cc98-rebuild-dual-editor-divider");
      const dualSourcePane = dualWorkspace?.querySelector(".cc98-rebuild-dual-ubb-source-pane");
      const dualSource = dualWorkspace?.querySelector(".cc98-rebuild-dual-ubb-source");
      check(
        "native UBB editor gains two editable surfaces",
        dualVisual?.getAttribute("contenteditable") === "true"
          && dualSource?.getAttribute("contenteditable") === "true",
        `${dualVisual?.getAttribute("contenteditable")}/${dualSource?.getAttribute("contenteditable")}`
      );
      check(
        "dual editor uses the requested guidance text",
        dualWorkspace?.querySelector(".cc98-rebuild-dual-ubb-title")?.textContent === "上下都可以编辑哦~",
        dualWorkspace?.querySelector(".cc98-rebuild-dual-ubb-title")?.textContent || ""
      );
      check(
        "dual editor panes expose the requested placeholders",
        dualVisual?.dataset.placeholder === "在这里直接编辑并预览内容"
          && dualSource?.dataset.placeholder === "在这里以经典代码形式编辑内容",
        `${dualVisual?.dataset.placeholder || ""}/${dualSource?.dataset.placeholder || ""}`
      );
      check(
        "native React textarea remains available as the data bridge",
        !dualNativeTextarea.readOnly
          && dualNativeTextarea.dataset.cc98DualUbbNative === "true"
          && getNativeEditorTextarea(dualNativeEditor) === dualNativeTextarea,
        `${dualNativeTextarea.readOnly}/${dualNativeTextarea.dataset.cc98DualUbbNative || ""}`
      );
      if (dualVisual instanceof HTMLElement) {
        dualVisual.textContent = "上方编辑";
        dualVisual.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: "上方编辑"
        }));
      }
      check(
        "visual native editor updates the original field",
        dualNativeTextarea.value === "上方编辑",
        dualNativeTextarea.value
      );
      if (dualSource instanceof HTMLElement) {
        dualSource.textContent = "下方[color=#ff0000]编辑[/color]";
        dualSource.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: "编辑"
        }));
        await waitForRegression(80);
      }
      check(
        "source native editor updates the original field and visual surface",
        dualNativeTextarea.value === "下方[color=#ff0000]编辑[/color]"
          && dualVisual?.textContent === "下方编辑"
          && Boolean(dualVisual?.querySelector("[style*='color']")),
        `${dualNativeTextarea.value}/${dualVisual?.innerHTML || ""}`
      );
      if (dualSource instanceof HTMLElement) {
        dualSource.focus();
        restoreProfileSignatureSourceSelection(dualSource, { start: 0, end: 2 });
        dualNativeEditor.__cc98DualUbbState?.rememberSelection?.();
        dualNativeEditor.__cc98WysiwygApplyColor?.("transparent");
      }
      check(
        "transparent color wraps the active native source selection",
        dualNativeTextarea.value === "[color=transparent]下方[/color][color=#ff0000]编辑[/color]",
        dualNativeTextarea.value
      );
      if (dualSource instanceof HTMLElement) {
        dualSource.textContent = "[b]标签[/b]正文";
        dualSource.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: "正文"
        }));
        await waitForRegression(80);
        dualSource.focus();
        restoreProfileSignatureSourceSelection(dualSource, {
          start: "[b]标签[/b]".length,
          end: "[b]标签[/b]".length
        });
      }
      const dualSourceCaretParent = window.getSelection()?.anchorNode?.parentElement;
      check(
        "source caret at a tag boundary does not inherit syntax color",
        Boolean(
          dualSourceCaretParent?.closest(".cc98-rebuild-profile-signature-syntax-boundary")
          && !dualSourceCaretParent?.closest(".cc98-rebuild-profile-signature-syntax-token")
        ),
        dualSourceCaretParent?.className || ""
      );
      if (dualSource instanceof HTMLElement) {
        dualSource.dispatchEvent(new KeyboardEvent("keydown", {
          bubbles: true,
          cancelable: true,
          key: "Enter"
        }));
        await waitForRegression(80);
      }
      check(
        "native UBB source Enter inserts a real newline",
        dualNativeTextarea.value === "[b]标签[/b]\n正文",
        JSON.stringify(dualNativeTextarea.value)
      );
      check(
        "native UBB source gutter numbers logical lines only",
        dualWorkspace?.querySelectorAll(".cc98-rebuild-dual-ubb-source-gutter-row").length === 2,
        String(dualWorkspace?.querySelectorAll(".cc98-rebuild-dual-ubb-source-gutter-row").length || 0)
      );
      if (dualVisual instanceof HTMLElement) {
        dualVisual.textContent = "test";
        dualVisual.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: "test"
        }));
        const colorTextNode = dualVisual.firstChild;
        if (colorTextNode instanceof Text) {
          const selectedRange = document.createRange();
          selectedRange.selectNodeContents(colorTextNode);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(selectedRange);
          dualNativeEditor.__cc98DualUbbState?.rememberSelection?.();

          // Reproduce the focus transition that used to overwrite the saved
          // selection with a collapsed caret while opening the color popover.
          const focusRange = document.createRange();
          focusRange.setStart(colorTextNode, colorTextNode.length);
          focusRange.collapse(true);
          selection.removeAllRanges();
          selection.addRange(focusRange);
          dualNativeEditor.__cc98DualUbbState?.rememberSelection?.({
            preserveNonCollapsed: true
          });
          dualNativeEditor.__cc98WysiwygApplyColor?.("#ff0000");
        }
      }
      check(
        "visual color keeps the selected text instead of inserting an empty tag",
        dualNativeTextarea.value === "[color=#ff0000]test[/color]",
        dualNativeTextarea.value
      );
      if (dualVisual instanceof HTMLElement) {
        renderProfileSignatureWysiwygFromUbb(dualVisual, "[align=right]右侧[ac01][/align]");
      }
      const alignedEmojiBlock = dualVisual?.querySelector('[data-cc98-ubb-tag="align"]');
      const alignedEmojiWrap = alignedEmojiBlock?.querySelector(
        ":scope > .cc98-rebuild-inline-emoji-wrap:last-child"
      );
      check(
        "emoji stays directly rendered and round-trips as one UBB token",
        alignedEmojiBlock instanceof HTMLElement
          && alignedEmojiWrap instanceof HTMLElement
          && Boolean(alignedEmojiWrap.querySelector("img.cc98-rebuild-inline-emoji"))
          && serializeProfileSignatureWysiwyg(dualVisual) === "[align=right]右侧[ac01][/align]",
        alignedEmojiBlock?.outerHTML || ""
      );
       if (dualVisual instanceof HTMLElement && alignedEmojiWrap instanceof HTMLElement) {
         const emojiCutRange = document.createRange();
         emojiCutRange.selectNode(alignedEmojiWrap);
        emojiCutRange.deleteContents();
        dualVisual.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "deleteByCut"
        }));
      }
      check(
        "editable emoji can be removed as one atomic character",
        dualNativeTextarea.value === "[align=right]右侧[/align]",
        dualNativeTextarea.value
      );
      if (dualVisual instanceof HTMLElement) {
        dualVisual.textContent = "工具栏";
        dualVisual.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: "工具栏"
        }));
        const textNode = dualVisual.firstChild;
        if (textNode instanceof Text) {
          const range = document.createRange();
          range.selectNodeContents(textNode);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          dualVisual.focus();
          dualNativeEditor.__cc98DualUbbState?.rememberSelection?.();
          dualNativeBold.click();
        }
      }
      check(
        "native toolbar formats the active visual surface",
        dualNativeTextarea.value === "[b]工具栏[/b]",
        dualNativeTextarea.value
      );
      if (
        dualVisualPane instanceof HTMLElement
        && dualSourcePane instanceof HTMLElement
        && dualDivider instanceof HTMLElement
      ) {
        dualVisualPane.style.setProperty("height", "300px", "important");
        dualSourcePane.style.setProperty("height", "200px", "important");
        dualDivider.dispatchEvent(new KeyboardEvent("keydown", {
          bubbles: true,
          cancelable: true,
          key: "ArrowDown"
        }));
      }
      check(
        "dual editor divider changes both pane heights",
        dualVisualPane?.style.height === "312px" && dualSourcePane?.style.height === "188px",
        `${dualVisualPane?.style.height || ""}/${dualSourcePane?.style.height || ""}`
      );
      const dualVisualResize = dualVisualPane instanceof HTMLElement ? getComputedStyle(dualVisualPane).resize : "";
      const dualSourceResize = dualSourcePane instanceof HTMLElement ? getComputedStyle(dualSourcePane).resize : "";
      check(
        "both dual editor panes support individual vertical resizing",
        dualVisualResize === "vertical" && dualSourceResize === "vertical",
        `${dualVisualResize}/${dualSourceResize}`
      );
      if (!new URLSearchParams(location.search).has("showDualEditor")) {
        dualNativeEditor.remove();
      }

      const signatureSyntaxLayer = document.createElement("pre");
      document.body.append(signatureSyntaxLayer);
      renderProfileSignatureSyntaxLayer(
        signatureSyntaxLayer,
        "[align=center][b]first[/b][/align]\n[color=#ff0000]second[/color]"
      );
      const signatureSyntaxTokens = [...signatureSyntaxLayer.querySelectorAll(".cc98-rebuild-profile-signature-syntax-token")];
      const tokenPairClass = (token) => [...(token?.classList || [])].find((name) => name.startsWith("is-pair-")) || "";
      check(
        "matching UBB tags share one structural color",
        tokenPairClass(signatureSyntaxTokens[1]) === tokenPairClass(signatureSyntaxTokens[2]),
        signatureSyntaxTokens.map((token) => `${token.textContent}:${tokenPairClass(token)}`).join(", ")
      );
      check(
        "independent UBB blocks rotate structural colors",
        tokenPairClass(signatureSyntaxTokens[0]) !== tokenPairClass(signatureSyntaxTokens[1])
          && tokenPairClass(signatureSyntaxTokens[4]) !== tokenPairClass(signatureSyntaxTokens[0]),
        signatureSyntaxTokens.map((token) => `${token.textContent}:${tokenPairClass(token)}`).join(", ")
      );
      check(
        "syntax layer keeps logical source line count",
        signatureSyntaxLayer.querySelectorAll(".cc98-rebuild-profile-signature-syntax-line").length === 2
      );
      check(
        "syntax color boundaries never change the logical UBB source",
        getProfileSignatureSourceText(signatureSyntaxLayer)
          === "[align=center][b]first[/b][/align]\n[color=#ff0000]second[/color]",
        getProfileSignatureSourceText(signatureSyntaxLayer)
      );
      signatureSyntaxLayer.remove();

      const signatureRouter = document.createElement("section");
      signatureRouter.className = "cc98-rebuild-native-user-router";
      const signatureConfig = document.createElement("div");
      signatureConfig.className = "user-center-config";
      const signatureField = document.createElement("div");
      const signatureLabel = document.createElement("p");
      signatureLabel.textContent = "修改签名档";
      const signatureTextarea = document.createElement("textarea");
      signatureTextarea.name = "signature";
      signatureTextarea.value = "选择这两个字";
      signatureField.append(signatureLabel, signatureTextarea);
      signatureConfig.append(signatureField);
      signatureRouter.append(signatureConfig);
      document.body.append(signatureRouter);
      stabilizeProfileSignatureToolbar(signatureRouter);
      const signatureEditor = signatureRouter.querySelector(".cc98-rebuild-profile-signature-editor");
      const signatureWysiwyg = signatureEditor?.querySelector(".cc98-rebuild-profile-signature-wysiwyg");
      const signatureBoldButton = [...(signatureEditor?.querySelectorAll(".cc98-rebuild-message-editor-button") || [])]
        .find((button) => button.textContent === "B");
      const signatureTextNode = signatureWysiwyg?.firstChild;
      if (signatureEditor && signatureWysiwyg && signatureBoldButton && signatureTextNode instanceof Text) {
        const signatureRange = document.createRange();
        signatureRange.setStart(signatureTextNode, 2);
        signatureRange.setEnd(signatureTextNode, 4);
        const signatureSelection = window.getSelection();
        signatureSelection.removeAllRanges();
        signatureSelection.addRange(signatureRange);
        rememberProfileSignatureWysiwygRange(signatureEditor, signatureWysiwyg);
        signatureBoldButton.click();
      }
      check(
        "profile signature editor applies formatting in the editable preview",
        Boolean(signatureWysiwyg?.querySelector("b, strong, [style*='font-weight']")),
        signatureWysiwyg?.innerHTML || ""
      );
      check(
        "profile signature editor generates UBB for the native field",
        signatureTextarea.value.includes("[b]这两[/b]"),
        signatureTextarea.value
      );
      if (signatureWysiwyg instanceof HTMLElement) {
        signatureWysiwyg.textContent = "test";
        signatureWysiwyg.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: "test"
        }));
        const profileColorTextNode = signatureWysiwyg.firstChild;
        if (profileColorTextNode instanceof Text) {
          const selectedRange = document.createRange();
          selectedRange.selectNodeContents(profileColorTextNode);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(selectedRange);
          signatureEditor?.__cc98WysiwygRememberSelection?.();
          const focusRange = document.createRange();
          focusRange.setStart(profileColorTextNode, profileColorTextNode.length);
          focusRange.collapse(true);
          selection.removeAllRanges();
          selection.addRange(focusRange);
          signatureEditor?.__cc98WysiwygRememberSelection?.({
            preserveNonCollapsed: true
          });
          signatureEditor?.__cc98WysiwygApplyColor?.("#ff0000");
        }
      }
      check(
        "profile color keeps the selected text after focus moves to the picker",
        signatureTextarea.value === "[color=#ff0000]test[/color]",
        signatureTextarea.value
      );
      check(
        "profile signature native textarea no longer overlays the editor",
        signatureTextarea.readOnly
          && signatureTextarea.dataset.cc98GeneratedSource === "true"
          && getComputedStyle(signatureTextarea).pointerEvents === "none",
        getComputedStyle(signatureTextarea).pointerEvents
      );
      const signatureSourceEditor = signatureEditor?.querySelector(".cc98-rebuild-profile-signature-syntax-layer");
      check(
        "profile signature editor does not expose an unsupported emoji picker",
        !signatureEditor?.querySelector(".cc98-rebuild-message-editor-toolbar button[title='插入表情']")
          && typeof signatureEditor?.__cc98WysiwygInsertEmoji !== "function"
      );
      check(
        "profile signature source is directly editable",
        signatureSourceEditor?.getAttribute("contenteditable") === "true"
          && Boolean(signatureEditor?.querySelector(".cc98-rebuild-dual-ubb-source-gutter")),
        signatureSourceEditor?.getAttribute("contenteditable") || ""
      );
      check(
        "profile signature panes expose the requested placeholders",
        signatureWysiwyg?.dataset.placeholder === "在这里直接编辑并预览内容"
          && signatureSourceEditor?.dataset.placeholder === "在这里以经典代码形式编辑内容",
        `${signatureWysiwyg?.dataset.placeholder || ""}/${signatureSourceEditor?.dataset.placeholder || ""}`
      );
      const signatureVisualPane = signatureEditor?.querySelector(".cc98-rebuild-dual-ubb-visual-pane");
      const signatureSourcePane = signatureEditor?.querySelector(".cc98-rebuild-dual-ubb-source-pane");
      check(
        "profile signature editor has a movable divider and resizable panes",
        signatureEditor?.querySelector(".cc98-rebuild-dual-editor-divider")
          && signatureVisualPane instanceof HTMLElement
          && signatureSourcePane instanceof HTMLElement
          && getComputedStyle(signatureVisualPane).resize === "vertical"
          && getComputedStyle(signatureSourcePane).resize === "vertical"
      );
      check(
        "profile signature guidance no longer says WYSIWYG",
        signatureEditor?.querySelector(".cc98-rebuild-profile-signature-preview-title")?.textContent === "上下都可以编辑哦~",
        signatureEditor?.querySelector(".cc98-rebuild-profile-signature-preview-title")?.textContent || ""
      );
      if (signatureSourceEditor instanceof HTMLElement) {
        signatureSourceEditor.textContent = "源码[color=#ff0000]修改[/color]";
        signatureSourceEditor.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: "修改"
        }));
        await waitForRegression(80);
      }
      check(
        "profile signature source edits update the native field",
        signatureTextarea.value === "源码[color=#ff0000]修改[/color]",
        signatureTextarea.value
      );
      check(
        "profile signature source edits update the WYSIWYG surface",
        signatureWysiwyg?.textContent === "源码修改"
          && Boolean(signatureWysiwyg?.querySelector("[style*='color']")),
        signatureWysiwyg?.innerHTML || ""
      );
      if (signatureSourceEditor instanceof HTMLElement) {
        signatureSourceEditor.focus();
        restoreProfileSignatureSourceSelection(signatureSourceEditor, { start: 0, end: 2 });
        signatureEditor?.__cc98WysiwygRememberSelection?.();
        signatureEditor?.__cc98WysiwygApplyColor?.("transparent");
      }
      check(
        "transparent color wraps the active signature source selection",
        signatureTextarea.value === "[color=transparent]源码[/color][color=#ff0000]修改[/color]",
        signatureTextarea.value
      );
      check(
        "profile signature source stays flat while keeping syntax colors",
        getComputedStyle(signatureSourceEditor?.querySelector(".cc98-rebuild-profile-signature-syntax-line")).display === "inline"
          && Boolean(signatureSourceEditor?.querySelector(".cc98-rebuild-profile-signature-syntax-token")),
        signatureSourceEditor?.innerHTML || ""
      );
      if (signatureSourceEditor instanceof HTMLElement) {
        signatureSourceEditor.textContent = "第一行第二行";
        signatureSourceEditor.dispatchEvent(new InputEvent("input", {
          bubbles: true,
          inputType: "insertText",
          data: "第一行第二行"
        }));
        await waitForRegression(80);
        signatureSourceEditor.focus();
        restoreProfileSignatureSourceSelection(signatureSourceEditor, { start: 3, end: 3 });
        signatureSourceEditor.dispatchEvent(new KeyboardEvent("keydown", {
          bubbles: true,
          cancelable: true,
          key: "Enter"
        }));
        await waitForRegression(80);
      }
      check(
        "profile signature source Enter inserts a real newline",
        signatureTextarea.value === "第一行\n第二行",
        JSON.stringify(signatureTextarea.value)
      );
      check(
        "profile signature gutter numbers logical lines only",
        signatureEditor?.querySelectorAll(".cc98-rebuild-dual-ubb-source-gutter-row").length === 2,
        String(signatureEditor?.querySelectorAll(".cc98-rebuild-dual-ubb-source-gutter-row").length || 0)
      );
      if (!new URLSearchParams(location.search).has("showSignature")) {
        signatureRouter.remove();
      }

      results.replaceChildren();
      checks.forEach((item) => {
        const row = document.createElement("p");
        row.dataset.passed = String(item.passed);
        row.textContent = `${item.passed ? "PASS" : "FAIL"}: ${item.name}${item.detail ? ` (${item.detail})` : ""}`;
        results.append(row);
      });
      document.title = checks.every((item) => item.passed) ? "PASS" : "FAIL";
    }

    run().catch((error) => {
      document.title = "FAIL";
      results.textContent = error?.stack || String(error);
    });
  </script>
</body>
</html>
