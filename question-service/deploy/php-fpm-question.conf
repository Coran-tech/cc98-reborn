[question]
user = question
group = question
listen = /run/php-fpm-question.sock
listen.owner = question
listen.group = nobody
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 15s
pm.max_requests = 500
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/question-service/log/php-error.log
php_admin_value[open_basedir] = /srv/question-service:/tmp
